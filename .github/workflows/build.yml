name: Build (Fabric 1.20.1)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Ставим Gradle 8.2 без wrapper'а
      - name: Install Gradle 8.2
        run: |
          GRADLE_VERSION=8.2
          curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH

      - name: Gradle version
        run: gradle --version

      - name: Build with Gradle
        run: gradle --no-daemon build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: neorifts-build
          path: build/libs/*.jar
