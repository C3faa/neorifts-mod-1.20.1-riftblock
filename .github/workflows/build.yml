name: Build (Fabric 1.20.1)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Устанавливаем Gradle 8.2 через SDKMAN (без wrapper'а)
      - name: Install Gradle 8.2
        uses: sdkman/sdkman-action@v2
        with:
          candidate: gradle
          version: '8.2'

      - name: Build with Gradle
        run: gradle --version && gradle --no-daemon build

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: neorifts-build
          path: build/libs/*.jar
