name: Build (Fabric 1.20.1)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=120000 -Dorg.gradle.internal.http.socketTimeout=120000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Temurin JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', 'settings.gradle', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Install Gradle 8.10.2
        run: |
          GRADLE_VERSION=8.10.2
          curl -L -o gradle.zip "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"
          unzip -q gradle.zip
          echo "$PWD/gradle-${GRADLE_VERSION}/bin" >> $GITHUB_PATH
                              
      - name: Gradle version
        run: gradle --version

      - name: Build with Gradle (retries + refresh)
        shell: bash
        run: |
          set +e
          for i in 1 2 3; do
            echo "Attempt $i..."
            gradle --no-daemon --refresh-dependencies --info --stacktrace build && ok=1 && break
            echo "Gradle failed (attempt $i). Waiting 20s and retrying..."
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "Build failed after 3 attempts"; exit 1
          fi

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: neorifts-build
          path: build/libs/*.jar
