pluginManagement {
    repositories {
        maven { url 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
        mavenCentral()
    }
    // Важно: маппим id плагина на модуль в Fabric Maven
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "fabric-loom") {
                useModule("net.fabricmc:fabric-loom:${requested.version}")
            }
        }
    }
}

dependencyResolutionManagement {
    // Можно оставить PREFER_SETTINGS — Loom всё равно добавит свои репозитории; предупреждения не критичны
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        maven { url 'https://libraries.minecraft.net/' } // Mojang libs (authlib, и т.п.)
        maven { url 'https://maven.fabricmc.net/' }      // Fabric
        mavenCentral()
        gradlePluginPortal()
        maven { url 'https://maven.minecraftforge.net/' } // запасной
    }
}

rootProject.name = "neorifts"
