plugins {
    id 'fabric-loom' version '1.6.12'
    id 'maven-publish'
}

group = 'com.neorifts'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    withSourcesJar()
}

repositories {
    // ВАЖНО: обычные репозитории объявляем здесь (а не в settings),
    // Loom сам добавит свои 'Loom*' репозитории.
    maven { url = 'https://maven.fabricmc.net/' }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings  "net.fabricmc:yarn:1.20.1+build.10:v2"

    modImplementation "net.fabricmc:fabric-loader:0.14.22"

    // Берём единый meta-артефакт Fabric API для 1.20.1
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.3+1.20.1"
}

// Опционально: чтобы jar имел нормальное имя
tasks.withType(Jar).configureEach {
    archiveBaseName.set('neorifts')
}

loom {
    // без дополнительных трюков
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
}
