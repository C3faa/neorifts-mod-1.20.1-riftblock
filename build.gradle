plugins {
    id 'fabric-loom' version '1.6.+'
    id 'maven-publish'
}

repositories {
    maven { url 'https://libraries.minecraft.net/' }
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}

// ВАЖНО: никаких отдельных под-модулей fabric-api (fabric-networking-api-v1 и пр.)!
// Только монолитный пакет, подходящий под 1.20.1.
dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings loom.yarn("1.20.1+build.10:v2")
    modImplementation "net.fabricmc:fabric-loader:0.14.22"

    // Монолитный Fabric API для 1.20.1
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.1+1.20.1"
}
