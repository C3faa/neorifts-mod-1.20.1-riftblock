plugins {
    id 'fabric-loom' version '1.5.9'
    id 'maven-publish'
}


sourceCompatibility = JavaVersion.VERSION_17
targetCompatibility = JavaVersion.VERSION_17

group = 'com.neoseoul'
version = '0.2.0'

repositories {
    maven { url 'https://libraries.minecraft.net/' }  // для com.mojang:authlib и др.
    maven { url 'https://maven.fabricmc.net/' }
    mavenCentral()
}



dependencies {
    minecraft "com.mojang:minecraft:1.20.1"
    mappings "net.fabricmc:yarn:1.20.1+build.10:v2"
    modImplementation "net.fabricmc:fabric-loader:0.14.22"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.92.0+1.20.1"
}

loom { splitEnvironmentSourceSets() }

tasks.withType(JavaCompile).configureEach {
    it.options.release = 17
}

jar { from("LICENSE") { rename { "${it}_${project.archivesBaseName}" } } }
